services:
  postgres:
    image: postgres:16
    container_name: ai-marketing-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_marketing
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ai-marketing-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: ai-marketing-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  queue-worker:
    build:
      context: ./services/queue-worker
      dockerfile: Dockerfile
    container_name: ai-marketing-queue-worker
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379
      # Python connector service (run on host: cd services/worker && uvicorn app.main:app --port 8000)
      WORKER_URL: ${WORKER_URL:-http://host.docker.internal:8000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis

volumes:
  postgres_data:
  redis_data:
  minio_data: